<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>__NAME__</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/themes/vue.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-darklight-theme@3/dist/docsify-darklight.min.css">
  <style>
    :root { --theme-color: #3f51b5; }
    .sidebar { padding-top: 16px; }
    .mermaid { text-align: center; margin: 1rem 0; }
    .markdown-section { max-width: 980px; }
  </style>
</head>
<body>
  <div id="app">載入中…</div>
  <script>
    window.$docsify = {
      name: '__NAME__',
      loadSidebar: true,
      subMaxLevel: 2,
      auto2top: true,
      relativePath: true,
      homepage: '__HOME__',
      search: {
        placeholder: '搜尋筆記…',
        noData: '找不到結果',
        depth: 3,
        paths: 'auto',
        maxAge: 86400000
      },
      mermaid: { theme: 'default' },
      darklightTheme: { defaultTheme: 'light' }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-mermaid@2/dist/docsify-mermaid.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-darklight-theme@3/dist/docsify-darklight.min.js"></script>
</body>
</html>
